const $=id=>document.getElementById(id);
function fmtList(){
  $("list").innerHTML=FILES.map(f=>'<div class="item"><span class="nm">'+f.n+'</span><span class="sz">'+f.s+'</span><a class="dl" href="'+f.u+'" target="_blank" rel="noopener">下载</a></div>').join("");
}
async function digest(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function enter(){
  const h=await digest($("key").value);
  if(h===HASH){
    sessionStorage.setItem("dg","1"); $("gate").style.display="none"; $("app").style.display="block"; fmtList();
  }else{ $("err").textContent="口令错误"; }
}
$("go").onclick=enter;
$("key").addEventListener("keydown",e=>{ if(e.key==="Enter") enter(); });
if(sessionStorage.getItem("dg")==="1"){ $("gate").style.display="none"; $("app").style.display="block"; fmtList(); }
