<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cloudsystem · 请输入访问口令</title>
<!-- 内联 favicon：正版 YubaoQiu 标识（玻璃球 + Y 字徽标，原创设计） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%233aa0ff'/%3E%3Cpath d='M23.5 21v21M23.5 23.5l12.5 17M23.5 31l11.5 13' stroke='white' stroke-width='3.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  /* 用 flex 不用 grid，且必须显式 flex-direction:column。
     两个坑叠在一起：
     1) grid + place-items:center 在矮屏（360px 高）上会把 .box 当 grid
        item 参与行高分配，整个登录框被推到视口下方，页面只剩一条横幅。
     2) flex 默认是 row（横向）！后端会往 body 里注入横幅占位 div，
        它成了第一个 flex item，把 .box 横向挤到屏幕外（x=视口宽），
        登录框同样看不见。写成 column 才是一列。
     配 align-items:flex-start 让超高的框能正常滚动 —— 居中时
     溢出的顶部够不着，矮屏上就点不到输入框。 */
  body{margin:0;min-height:100vh;display:flex;
       flex-direction:column;align-items:center;justify-content:flex-start;
       background:radial-gradient(1200px 600px at 50% -10%,#2b1a4d,#0b0a12 60%,#07070c);
       color:#e8e6ef;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:20px;overflow-y:auto;overscroll-behavior:contain}
  .box{margin:auto 0;width:100%;max-width:400px;flex:0 0 auto;
       background:rgba(255,255,255,.045);
       border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px 22px;
       box-shadow:0 24px 60px rgba(0,0,0,.55);backdrop-filter:blur(12px)}
  .logo{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
        background:none;display:grid;place-items:center;}
  h1{margin:0 0 6px;font-size:19px;text-align:center;letter-spacing:.3px}
  p.sub{margin:0 0 22px;text-align:center;color:#a09fb0;font-size:13px}
  label{display:block;font-size:12px;color:#b9b7c6;margin:0 0 6px 2px}
  input{width:100%;padding:13px 15px;border-radius:11px;border:1px solid rgba(255,255,255,.14);
        background:rgba(0,0,0,.35);color:#fff;font-size:16px;outline:none;transition:border-color .15s}
  input:focus{border-color:#7c6cf0;box-shadow:0 0 0 3px rgba(124,108,240,.2)}
  button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:11px;cursor:pointer;
         background:linear-gradient(135deg,#7c6cf0,#5a4bd6);color:#fff;font-size:15px;font-weight:600;
         transition:transform .08s,filter .15s}
  button:hover{filter:brightness(1.08)} button:active{transform:scale(.985)}
  button:disabled{opacity:.6;cursor:progress}
  .msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center}
  .msg.err{color:#ff7a7a} .msg.ok{color:#7ddc7d}
  .tip{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
       font-size:12px;color:#807e8e;line-height:1.75}
  .tip b{color:#a9a7b8;font-weight:600}
  .dots{letter-spacing:3px;color:#6a6880}
  /* 进度条：把登录过程的阶段显式出来，避免"点了没反应"的错觉 */
  .prog{width:100%;max-width:340px;margin:4px 0 0}
  .prog-track{height:7px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
  .prog-bar{height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#7c6cf0,#5a4bd6);transition:width .25s ease}
  .prog-bar.busy{background:linear-gradient(90deg,#7c6cf0,#9c8cff,#7c6cf0);background-size:200% 100%;animation:progflow 1.1s linear infinite}
  @keyframes progflow{from{background-position:200% 0}to{background-position:-200% 0}}
  .prog-txt{margin-top:7px;font-size:12.5px;color:#cbb8da;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><svg class="yubaoqiu-logo" width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><radialGradient id="ylLogin" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#8ff7ff"/><stop offset="42%" stop-color="#3aa0ff"/><stop offset="100%" stop-color="#5b21b6"/></radialGradient></defs><circle cx="32" cy="32" r="28" fill="url(#ylLogin)"/><ellipse cx="23" cy="19" rx="11" ry="6.5" fill="rgba(255,255,255,.32)"/><path d="M23.5 21v21M23.5 23.5l12.5 17M23.5 31l11.5 13" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/></svg></div>
  <h1>cloudsystem</h1>
  <p class="sub">请输入访问口令</p>

  <label for="k">访问口令</label>
  <!-- autocomplete 必须关掉。之前写 current-password，手机浏览器会把
       上一次用过的旧口令自动填进来，输入框看着有字但内容是过期的，
       提交必然提示"口令不对"——用户完全看不出哪里不对，反复重试就成了死循环。
       顺带清掉输入框，避免浏览器再把这次的值存进密码管理器。 -->
  <input id="k" type="password" inputmode="text" autocomplete="off"
         autocapitalize="off" autocorrect="off" spellcheck="false"
         placeholder="启动服务时终端里打印的那串字符" autofocus>
  <button id="go">进入桌面</button>
  <div class="prog" id="prog" style="display:none">
    <div class="prog-track"><div class="prog-bar busy" id="progBar"></div></div>
    <div class="prog-txt" id="progTxt">正在连接服务器…</div>
  </div>
  <div class="msg" id="msg"></div>

  <!-- 应急解锁：主密钥绑定了 IP，换网络后进不来时用备用密钥点一下即可。
       不做成命令行就是这个原因 —— 手机上没法敲。 -->
  <div id="trustBox" style="display:none;margin-top:14px;padding:14px;
       border:1px solid rgba(255,255,255,.12);border-radius:11px;background:rgba(0,0,0,.25)">
    <div style="font-size:12.5px;color:#b9b7c6;margin-bottom:9px">
      你的网络 IP 变了，主密钥用不了。<br>
      输入<b style="color:#e8e6ef">测试密钥</b>把当前 IP 授权给你的主密钥：
    </div>
    <input id="tk" type="password" inputmode="text" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="测试密钥（字母+数字）">
    <button id="tgo" style="margin-top:9px">授权当前 IP</button>
    <div class="msg" id="tmsg" style="text-align:left;margin-top:9px"></div>
  </div>

  <div class="tip">
    <b>为什么需要口令？</b><br>
    这个模拟器后端能执行真实 Linux 命令，等于把一个 shell 挂在公网上。<br>
    口令不对就进不来，猜对了才放行。
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const inp=$("#k"), btn=$("#go"), msg=$("#msg");

function say(t,cls){ msg.textContent=t; msg.className="msg "+(cls||""); }

// 进页面先把输入框彻底清空。
// 光关掉 autocomplete 挡不住已经存进密码管理器的旧值 —— 部分浏览器
// 仍会在渲染时回填。必须显式清一次，否则用户看到"框里已经有字"，
// 以为是自己刚输的，实际是过期的旧口令，提交就报口令不对。
inp.value="";
try{ inp.setAttribute("value",""); }catch(e){}
inp.addEventListener("input",()=>{ inp.removeAttribute("value"); });

// 失焦时再清一次，覆盖浏览器渲染后异步回填的情况
window.addEventListener("load",()=>setTimeout(()=>{ inp.value=""; },50));

function done(token){
  try{ sessionStorage.setItem("lsim_token", token); }catch(e){}
  // 第一道门(访问密钥)过了就直接进桌面，绝不再弹 GDM 锁屏 ——
  // 否则用户输完密钥"进入桌面"后看到的是近黑的 GDM 背景、桌面图标
  // 一个没渲染，以为卡死了。GDM 仅作为点 🔒 锁定后的二次进入界面保留。
  try{ sessionStorage.setItem("gnome.sim.session",
        JSON.stringify({t:Date.now(), on:true, w:[]})); }catch(e){}
  // 清掉地址栏里的口令，避免留在历史/截图里
  history.replaceState(null,"","/");
  location.replace("/");
}

async function submit(){
  const k=inp.value.trim();
  if(!k){ say("请输入口令","err"); inp.focus(); return; }
  btn.disabled=true; btn.textContent="验证中…"; say("");
  // 进度条：先把第一格顶上去，让用户立刻看到"有反应"
  const prog=document.getElementById("prog"),
        pbar=document.getElementById("progBar"),
        ptxt=document.getElementById("progTxt");
  prog.style.display="block"; pbar.className="prog-bar busy";
  const step=(pct,txt)=>{ pbar.style.width=pct+"%"; if(txt) ptxt.textContent=txt; };
  step(12,"正在连接服务器…");
  try{
    step(30,"正在核对密钥…");
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
                                    body:JSON.stringify({key:k})});
    const j=await r.json();
    if(j.ok && j.token){
      step(70,"密钥正确，正在生成访问令牌…");
      await new Promise(res=>setTimeout(res,260));
      step(92,"正在进入桌面…");
      await new Promise(res=>setTimeout(res,260));
      done(j.token);
      return;
    }
    // 失败：把进度条收掉，恢复正常按钮，让用户看清错误原因
    prog.style.display="none"; pbar.style.width="0%";
    // 403 且提示里带"IP" = 口令对但 IP 不在白名单，把应急解锁面板亮出来。
    // 这段必须留在 submit() 里面。曾经误挪到脚本顶层，r/j 作用域外，
    // 直接 ReferenceError 把整个 script 打断 —— btn.onclick 还没绑定
    // 就已经抛异常，于是点"进入桌面"毫无反应，非常难查。
    if(r.status===403 && /IP/.test(j.err||"")){
      say(j.err,"err");
      document.getElementById("trustBox").style.display="block";
      document.getElementById("tk").focus();
      btn.disabled=false; btn.textContent="进入桌面";
      return;
    }
    // 光说"口令不对"没用 —— 用户很可能压根没输入，或者输入框里
    // 还留着浏览器自动填的旧口令。直接把输入框清空让他重输。
    inp.value="";
    const t=j.err||"口令不对";
    // 429 = 触发了防爆破锁定，明确告诉用户要等多久，
    // 否则他只会以为又"口令不对"，然后一直重复提交。
    say(t+(r.status===429?"":"（已清空输入框，请重新输入）"),"err");
    if(r.status===429){ btn.textContent="已被限流保护"; }
    inp.focus();
  }catch(e){
    prog.style.display="none"; pbar.style.width="0%";
    say("网络错误："+(e.message||e),"err");
  }finally{
    if(btn.textContent!=="已被限流保护"){ btn.disabled=false; btn.textContent="进入桌面"; }
  }
}

// 全局兜底：任何未捕获异常都显示出来，别再"点了没反应"却毫无线索
window.addEventListener("error",e=>{
  try{ say("页面出错："+(e.message||e),"err"); }catch(_){}
});

btn.onclick=submit;
inp.onkeydown=e=>{ if(e.key==="Enter") submit(); };

// ---- 应急解锁 ----
const tk=document.getElementById("tk"), tgo=document.getElementById("tgo"),
      tmsg=document.getElementById("tmsg");
tgo.onclick=async()=>{
  const k2=tk.value.trim();
  if(!k2){ tmsg.textContent="请输入测试密钥"; tmsg.className="msg err"; return; }
  tgo.disabled=true; tgo.textContent="授权中…"; tmsg.textContent="";
  try{
    const r2=await fetch("/api/trust",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key:k2,action:"add"})});
    const j2=await r2.json();
    if(j2.ok){
      tmsg.textContent=j2.msg+" —— 现在可以用主密钥进了，正在跳转…";
      tmsg.className="msg ok";
      setTimeout(()=>location.replace("/"),1200);
    }else{
      tmsg.textContent=j2.err||"授权失败"; tmsg.className="msg err";
      tgo.disabled=false; tgo.textContent="授权当前 IP";
    }
  }catch(e){
    tmsg.textContent="网络错误："+(e.message||e); tmsg.className="msg err";
    tgo.disabled=false; tgo.textContent="授权当前 IP";
  }
};
tk.onkeydown=e=>{ if(e.key==="Enter") tgo.click(); };
</script>
</body>
</html>
